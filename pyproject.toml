[project]
name = "svex-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.7",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.12",
    "python-decouple>=3.8",
    "qrcode[pil]>=8.2",
    "requests>=2.32.5",
]

[tool.black]
line-length = 88
exclude = '''
/(
    venv
)/
'''

[dependency-groups]
dev = [
    "black>=25.9.0",
    "pre-commit>=4.3.0",
]
