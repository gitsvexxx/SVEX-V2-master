name: Apply support chat update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-support-chat:
    if: github.event.head_commit.message == 'Apply updated Tawk chat and withdrawal email support'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Tawk and withdrawal support buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new_tawk = "https://embed.tawk.to/6ababb4ebabf1d344126c05c/1k3kmnan0"

          # Replace the Tawk property in every HTML template that contains the widget.
          for path in Path("SVEX_APP/templates").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              updated = re.sub(
                  r"s1\.src='https://embed\.tawk\.to/[^']+';",
                  f"s1.src='{new_tawk}';",
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Replace the withdrawal popup's WhatsApp button with email support.
          withdraw = Path("SVEX_APP/templates/SVEX_APP/wallets/withdraw.html")
          text = withdraw.read_text(encoding="utf-8")
          pattern = re.compile(r'<a href="https://wa\.me/".*?</a>', re.DOTALL)
          email_button = '''<a href="mailto:support@seon-nl.com" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #2563eb; border: none; padding: 14px; border-radius: 100px; font-weight: 700; font-size: 16px; cursor: pointer; color: #0f172a; text-decoration: none; transition: transform 0.2s;">\n                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h18v14H3z M3 5l9 7 9-7"></path></svg>\n                    Email Support\n                </a>'''
          updated, count = pattern.subn(email_button, text, count=1)
          if count:
              withdraw.write_text(updated, encoding="utf-8")

          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SVEX_APP/templates .github/workflows/apply-support-chat-update.yml
          git rm .github/workflows/apply-support-chat-update.yml
          git commit -m "Update Tawk chat and withdrawal support options"
          git push