<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        /* Base & Body */
        body {
             /* A very dark grey for the page background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        /* Form Layout */
        .form-container {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
        }
        .form-title {
            color: #0f172a;
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin: 0 0 0.5rem 0;
        }
        .form-subtitle {
            color: #a0a0a0;
            margin: 0 0 2rem 0;
            font-size: 1rem;
            text-align: center;
            line-height: 1.5;
        }

        /* Form Groups and Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            color: #334155;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input::placeholder {
            color: #6b7280;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        /* Error Messages */
        .error-message {
            margin-top: 0.5rem;
            color: #fca5a5;
            font-size: 0.875rem;
        }

        /* Form Actions (Buttons) */
        .form-actions {
            margin-top: 1.5rem;
        }
        .btn {
            display: block;
            width: 100%;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
            color: #0f172a;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
        }
        .btn-primary {
            background-color: #2563eb;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Extra Links */
        .extra-links {
            text-align: center;
            margin-top: 1.5rem;
        }
        .extra-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .extra-links a:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">Reset Your Password</h1>
        <p class="form-subtitle">Enter the email associated with your account and we'll send a link to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                {{ form.email.label_tag }}
                {{ form.email }}
                {% for error in form.email.errors %}
                    <div class="error-message">{{ error }}</div>
                {% endfor %}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </div>
        </form>

        <div class="extra-links">
            <a href="#">Back to Login</a>
        </div>
    </div>
</body>
</html>
