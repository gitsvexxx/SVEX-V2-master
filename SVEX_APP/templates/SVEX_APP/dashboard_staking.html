{% extends 'SVEX_APP/navbar/layout.html' %}

{% block title %}Staking - SVEX Trading{% endblock %}

{% block content %}
    <style>
        .construction-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .construction-animation {
            font-size: 120px;
            margin-bottom: 30px;
            animation: rotate 3s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .construction-title {
            font-size: 3em;
            color: #333;
            margin: 20px 0;
            font-weight: bold;
        }
        .construction-subtitle {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 40px;
        }
        .construction-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            color: #0f172a;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .dots {
            display: inline-block;
            margin-left: 5px;
        }
        .dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }
        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>

    <div class="construction-content">
        <div class="construction-animation">⚙️</div>
        
        <h1 class="construction-title">Under Construction</h1>
        
        <p class="construction-subtitle">
            We're working hard to bring you something amazing<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </p>
        
        <div class="construction-badge">
            🚧 COMING SOON 🚧
        </div>
    </div>
{% endblock %}
