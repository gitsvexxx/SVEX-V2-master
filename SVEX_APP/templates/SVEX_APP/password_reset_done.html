<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Sent</title>
    <style>
        /* Base & Body */
        body {
            
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        /* Message Box Layout */
        .message-box {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            text-align: center;
        }

        /* Icon */
        .icon {
            width: 60px;
            height: 60px;
            stroke: #22c55e; /* Green for success */
            margin: 0 auto 1.5rem auto;
        }

        /* Typography */
        .title {
            color: #0f172a;
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }
        .subtitle {
            color: #a0a0a0;
            margin: 0 0 2rem 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Action Link */
        .login-link {
            display: inline-block;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
            color: #0f172a;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #2563eb;
        }
        .login-link:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <!-- Success Icon -->
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>

        <h1 class="title">Check Your Email</h1>
        <p class="subtitle">
            If an account with that email exists, we have sent instructions for resetting your password.
        </p>

        <a href="{% url 'new_login' %}" class="login-link">Back to Login</a>
    </div>
</body>
</html>
