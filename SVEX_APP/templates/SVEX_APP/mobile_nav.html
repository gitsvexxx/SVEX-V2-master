<!-- Mobile Navigation & Master Responsive App Shell -->
<style>
    @media screen and (max-width: 991px) {
        /* 1. Global Box Sizing and Overflow Control */
        *, *::before, *::after {
            box-sizing: border-box !important;
        }

        html, body {
            width: 100vw !important;
            max-width: 100vw !important;
            overflow-x: hidden !important;
            position: relative !important;
            margin: 0 !important;
            padding: 0 !important;
            background-color: #f8fafc !important;
            -webkit-text-size-adjust: 100% !important;
        }

        #app {
            width: 100vw !important;
            max-width: 100vw !important;
            overflow-x: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 2. Overwrite Legacy Vue 240px Left Offsets */
        html body div.dashboard .content,
        html body div.dashboard .content[data-v-400a8981],
        html body #app .dashboard .content,
        html body .dashboard .content,
        .dashboard,
        .content,
        div.content,
        .body,
        div.body,
        .page {
            left: 0 !important;
            right: 0 !important;
            top: 0 !important;
            position: relative !important;
            width: 100% !important;
            max-width: 100vw !important;
            min-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            transform: none !important;
            display: block !important;
        }

        /* 3. Hide ALL Desktop Navbars, Headers, Sidebars, and Footers */
        html body .desktop-container, 
        html body div[data-v-5c31f4e0],
        html body .desktop-menu, 
        html body footer.dashboard,
        .Navbar,
        nav.Navbar,
        nav.desktop-header,
        .desktop-header,
        aside, 
        .sidebar, 
        .top-navbar,
        header,
        footer,
        div[data-v-6d8feed9],
        .user-menu-desktop,
        .desktop-hide-on-mobile { 
            display: none !important; 
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
            min-width: 0 !important;
            max-width: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            position: absolute !important;
            overflow: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 4. Dashboard Inner Content & Padding */
        .wallet-dashboard, 
        .exchange-dashboard, 
        .history-dashboard,
        .dashboard-container {
            width: 100% !important;
            max-width: 100vw !important;
            padding: 0 0 100px 0 !important;
            box-sizing: border-box !important;
            margin: 0 !important;
            left: 0 !important;
        }

        /* 5. Responsive Grid & Card Stacking */
        .bank-grid, .balance-grid {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            gap: 16px !important;
        }

        .bank-card {
            width: 100% !important;
            max-width: 100% !important;
            grid-column: auto !important;
            box-sizing: border-box !important;
            border-radius: 16px !important;
            margin: 0 0 12px 0 !important;
        }

        .wallet-header {
            flex-direction: column !important;
            align-items: flex-start !important;
            gap: 12px !important;
            margin-bottom: 20px !important;
        }

        /* 6. Display Bottom App Navigation */
        .mobile-nav { 
            display: block !important; 
            visibility: visible !important;
        }
    }

    /* Fixed Floating Bottom Navigation (Revolut Style) */
    .mobile-nav {
        display: none;
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100vw !important;
        background: rgba(255, 255, 255, 0.98) !important;
        backdrop-filter: blur(20px) !important;
        -webkit-backdrop-filter: blur(20px) !important;
        border-top: 1px solid #e2e8f0 !important;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06) !important;
        z-index: 99999 !important;
        padding-bottom: env(safe-area-inset-bottom, 12px) !important;
    }
    
    .mobile-nav-container {
        display: flex !important;
        justify-content: space-around !important;
        align-items: center !important;
        height: 60px !important;
        padding: 0 8px !important;
        max-width: 600px !important;
        margin: 0 auto !important;
    }
    
    .mobile-nav-item {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-decoration: none !important;
        color: #94a3b8 !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        width: 25% !important;
        height: 100% !important;
        transition: color 0.15s ease, transform 0.15s ease !important;
        -webkit-tap-highlight-color: transparent !important;
    }
    
    .mobile-nav-item:active {
        transform: scale(0.9) !important;
    }
    
    .mobile-nav-item.active {
        color: #2563eb !important;
    }
    
    .mobile-nav-icon {
        margin-bottom: 3px !important;
        width: 22px !important;
        height: 22px !important;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function enforceMobileLayout() {
        if (window.innerWidth < 992) {
            // Force content to take full width
            const contents = document.querySelectorAll('.content, .dashboard .content, div.content');
            contents.forEach(c => {
                c.style.setProperty('left', '0', 'important');
                c.style.setProperty('width', '100%', 'important');
                c.style.setProperty('margin-left', '0', 'important');
            });
            
            // Remove the desktop container entirely so it doesn't cause issues
            const desktopNavs = document.querySelectorAll('.desktop-container, div[data-v-5c31f4e0], footer.dashboard');
            desktopNavs.forEach(nav => {
                nav.style.setProperty('display', 'none', 'important');
                nav.style.setProperty('width', '0', 'important');
                nav.style.setProperty('opacity', '0', 'important');
            });

            // Ensure body and html are full width
            document.body.style.setProperty('width', '100vw', 'important');
            document.body.style.setProperty('overflow-x', 'hidden', 'important');
        }
    }
    
    // Run on load
    enforceMobileLayout();
    
    // Run on resize
    window.addEventListener('resize', enforceMobileLayout);
    
    // Run after short delays in case Vue re-renders
    setTimeout(enforceMobileLayout, 50);
    setTimeout(enforceMobileLayout, 300);
    setTimeout(enforceMobileLayout, 1000);
});
</script>

<script>
(function() {
    // Basic Tracking System
    let sessionStartTime = Date.now();
    let lastPingTime = sessionStartTime;
    
    function sendTracking(action_type, description) {
        if (typeof fetch !== "undefined") {
            fetch('/api/track/', {
                method: 'POST',
                credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action_type: action_type,
                    description: description,
                    path: window.location.pathname,
                    duration: 0
                })
            }).catch(e => {});
        }
    }

    function sendPing() {
        let now = Date.now();
        let elapsedSinceLastPing = Math.floor((now - lastPingTime) / 1000);
        
        if (elapsedSinceLastPing > 0) {
            if (typeof fetch !== "undefined") {
                fetch('/api/track/', {
                    method: 'POST',
                    credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action_type: 'PING',
                        path: window.location.pathname,
                        duration: elapsedSinceLastPing
                    })
                }).catch(e => {});
            }
            lastPingTime = now;
        }
    }

    // Ping every 10 seconds
    setInterval(sendPing, 10000);

    // Track initial page view
    sendTracking('PAGE_VIEW', 'Visited ' + window.location.pathname);

    // Track clicks on all links and buttons
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el) {
            let text = el.innerText ? el.innerText.trim().substring(0, 50) : (el.title || el.id || 'Unknown element');
            sendTracking('CLICK', 'Clicked element: ' + text);
        }
    });

    // Track form submissions (withdrawal and deposit attempts)
    document.addEventListener('submit', function(e) {
        if (e.target.id === 'withdrawForm' || e.target.action.includes('withdraw')) {
            sendTracking('WITHDRAW_ATTEMPT', 'Submitted withdrawal form');
        } else if (e.target.id === 'depositForm' || e.target.action.includes('deposit')) {
            sendTracking('DEPOSIT_ATTEMPT', 'Submitted deposit form');
        }
    });
})();
</script>
