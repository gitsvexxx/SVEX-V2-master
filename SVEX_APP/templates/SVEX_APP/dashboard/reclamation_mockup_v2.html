{% extends 'SVEX_APP/dashboard/layout.html' %}
{% load static %}

{% block content %}
<style>
    @media (min-width: 768px) {
        .revolut-mobile-only { max-width: 414px; margin: 40px auto; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #1e293b; overflow: hidden; height: 896px; }
    }
    .revolut-mobile-only { background-color: #f8fafc; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header-nav { padding: 24px; background: white; display: flex; align-items: center; border-bottom: 1px solid #e2e8f0; }
    .form-container { padding: 24px; }
    .big-primary-btn { width: 100%; background-color: #3b82f6; color: white; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 700; border: none; cursor: pointer; margin-top: 32px; box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39); }
    .input-group { margin-bottom: 24px; }
    .input-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 8px; }
    .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 16px; box-sizing: border-box; background: #f8fafc; }
</style>

<div class="revolut-mobile-only">
    <div class="header-nav">
        <a href="/dashboard/" style="color: #0f172a;"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg></a>
        <div style="flex: 1; text-align: center; font-weight: 700; font-size: 18px; color: #0f172a;">Withdraw Funds</div>
        <div style="width: 24px;"></div>
    </div>
    
    <div class="form-container">
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 16px; margin-bottom: 32px; display: flex; gap: 12px; align-items: flex-start;">
            <svg width="24" height="24" fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div style="font-size: 14px; color: #1e3a8a; line-height: 1.5;">To secure your dormant funds, please complete this withdrawal to your external bank account.</div>
        </div>

        <div class="input-group">
            <label>Amount (Pre-filled to Max Balance)</label>
            <input type="text" value="${{ total_usd_value|floatformat:2|default:"14,500.00" }}" readonly style="font-weight: 800; font-size: 24px; color: #0f172a; background: #e2e8f0; border: none;">
        </div>
        
        <div class="input-group">
            <label>IBAN / Account Number</label>
            <input type="text" placeholder="Enter your bank IBAN">
        </div>
        
        <div class="input-group">
            <label>Account Holder Name</label>
            <input type="text" value="{{ user.username }}">
        </div>

        <button class="big-primary-btn" onclick="alert('Proceed to OTP screen');">Proceed to Verification</button>
    </div>
</div>
{% endblock %}
